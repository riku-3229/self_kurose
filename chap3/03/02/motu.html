    <h1>もつ鍋とは</h1>
    <p>
        もつ鍋は、牛や豚の内臓（もつ）を使った日本の鍋料理で、特に福岡県の名物として知られています。
    </p>

    <h2>もつ鍋の特徴</h2>
    <p>
        新鮮なもつと野菜をたっぷり使い、醤油や味噌ベースのスープで煮込むのが特徴です。
    </p>

    <h3>主な具材</h3>
    <ul>
        <li>牛もつ（小腸など）</li>
        <li>キャベツ</li>
        <li>ニラ</li>
        <li>にんにく</li>
        <li>唐辛子</li>
    </ul>

    <h2>もつ鍋の楽しみ方</h2>
    <p>
        最後にちゃんぽん麺やご飯を入れて締めるのが定番の楽しみ方です。
    </p>

    <h3>おすすめの締め</h3>
    <ol>
        <li>ちゃんぽん麺</li>
        <li>雑炊</li>
    </ol>
