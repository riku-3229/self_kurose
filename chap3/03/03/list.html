<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>箇条書きのタグ</title>
</head>
<body>
    <h1>箇条書きのタグ</h1>
    <!-- 順序なしリスト -->
     <ul>
        <li>りんご</li>
        <li>みかん</li>
        <li>ぶどう</li>

     </ul>
<!-- 順序ありリスト -->
     <ol>
        <li>ステップ１：材料を準備する</li>
        <li>ステップ２：混ぜる</li>
        <li>ステップ３：焼く</li> 
     </ol>
    <!-- 多階層リスト -->
     <ul>
        <li>果物
            <ul>
                <li>りんご</li>
                <li>みかん</li>
            </ul>
        </li>
        <li>野菜
            <ul>
                <li>にんじん</li>
                <li>きゅうり</li>
            </ul>

        </li>
     </ul>
</body>
</html>
