<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>表を作るタグ</title>

</head>

<body>
    <table border="1">
        <thead>
            <tr>
                <!-- 見出し -->
                <!-- 1 -->
                <th>アイテム名</th>
                <th>種類</th>
                <th>レア度</th>
            </tr>
        </thead>

        <tbody>
            <!-- 表のデータ -->
            <tr>
                <!-- 2  -->
                <td>ひのきのつるぎ</td>
                <td>武器</td>
                <td>★</td>
            </tr>
            <tr>
                <!-- 3 -->
                <td>ねこのおまもり</td>
                <td>防具</td>
                <td>★★</td>
            </tr>
            <tr>
                <!-- 4 -->
                <td>ふしぎなりんご</td>
                <td>消耗品</td>
                <td>★★★</td>
            <tr>
                <!-- 5 -->
                <td>そろとぶブーツ</td>
                <td>装備</td>
                <td>★★★★</td>
            </tr>
        </tbody>

    </table>
    <table border="1">
        <thead>
            <th colspan="3">葬送のフリーレン パーティーメンバー</th>
            <tr>
                <th>パーティー</th>
                <th>名前</th>
                <th>職業</th>
            </tr>

        </thead>
        <tbody>
            <tr>
                <td rowspan="4">ヒンメル一行</td>
                <td>ヒンメル</td>
                <td>勇者</td>
            </tr>
            <tr>
                <td>フリーレン</td>
                <td>魔法使い</td>
            </tr>
            <tr>
                <td>アイゼン</td>
                <td>戦士</td>
            </tr>
            <tr>
                <td>ハイター</td>
                <td>僧侶</td>
            </tr>
        </tbody>


    </table>
</body>

</html>
